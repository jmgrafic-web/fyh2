nl:
  title: Find Your Haven — Jouw Property Partner aan de Catalaanse kust
  description: 'Architecten en vastgoedprofessionals die je helpen je woning aan de Catalaanse kust te vinden en te transformeren: Costa Brava, Maresme en Costa Daurada.'
  hero_alt: Stenen terras met zwembad en uitzicht op de Middellandse Zee
  hero_title:
  - Vind jouw
  - mediterrane toevluchtsoord.
  hero_sub:
  - Geworteld in architectuur.
  - Gericht op jou.
  hero_text: We begeleiden je bij elke stap om een plek te vinden en te transformeren die echt als de jouwe voelt.
  hero_cta: Vertel ons wat je zoekt
  hero_cta_short: Laten we praten
  hero_cta2: Ontdek hoe wij werken
  points:
  - Eén aanspreekpunt
