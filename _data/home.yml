  model_eyebrow: Notre modèle
  model_h2: En architectes, nous vous accompagnons.
  model_h2_em: Toujours à vos côtés.
  model_p1: Acheter une maison en Méditerranée, c'est bien plus que trouver une belle maison. C'est choisir un lieu, comprendre son potentiel et prendre des décisions en toute confiance. C'est pourquoi nous réunissons savoir-faire architectural, expérience immobilière et un réseau de partenaires sélectionnés pour vous accompagner de la première idée jusqu'au dernier détail.
  model_p2: <strong>Notre accompagnement ne vous coûte rien.</strong> Nous travaillons avec des partenaires sélectionnés pour vous aider à avancer avec discernement, transparence et sérénité.
  model_alt: Salon d'une maison méditerranéenne ouvert sur la mer
  model_flow_label: Vous, Find Your Haven et nos partenaires
  flow:
  - t: Vous
    p: Nous comprenons vos besoins, vos priorités et la façon dont vous souhaitez vivre.
  - t: Find Your Haven
    p: Nous vous orientons et coordonnons le processus avec un regard à la fois architectural et immobilier.
  - t: Nos partenaires
    p: Nous collaborons avec des professionnels sélectionnés lorsque chaque projet le demande.
  model_cta: Parlons de ce que vous avez en tête
  svc_eyebrow: Nos services
  svc_h2: De la première recherche à la remise des clés.
  svc_h2_em: Six services. Un seul interlocuteur.
  svc_intro: Nous vous aidons à prendre des décisions éclairées à chaque étape, en associant vision architecturale, connaissance du marché et accompagnement personnalisé.
  services:
  - t: Recherche et rapport préliminaire
    p: Nous analysons vos besoins et vos priorités pour définir un point de départ clair, puis recherchons des options en accord avec votre mode de vie et vos objectifs, au-delà des photos.
    url: /fr/blog/acheter-maison-costa-brava-etranger-guide/
    img: /assets/img/hero/hero-terraza-tablet.jpg
  - t: Due diligence technique
    p: Nous examinons les aspects techniques importants du bien pour vous aider à comprendre son état, ses possibilités et les points à étudier avant de décider.
    url: /fr/blog/due-diligence-technique-immobiliere-explication/
    img: /assets/img/home/servicios.jpg
  - t: Représentation
    p: Nous défendons vos intérêts tout au long du processus, facilitons la communication entre les parties et vous aidons à avancer avec davantage de clarté.
    url: /fr/blog/erreurs-juridiques-achat-sans-avocat/
    img: /assets/img/home/contacto.jpg
  - t: Architecture, rénovation et travaux
    p: Nous évaluons le potentiel de chaque espace et vous accompagnons dans la définition d'améliorations, de rénovations et de solutions adaptées à vos besoins.
    url: /fr/blog/cout-renovation-cote-catalane-guide/
    img: /assets/img/home/paso-02.jpg
  - t: Architecture d'intérieur
    p: Nous concevons des intérieurs fonctionnels et sereins, avec des matériaux naturels, des proportions soignées et une esthétique liée à la Méditerranée.
    url: '#contact'
    img: /assets/img/home/paso-03.jpg
  - t: Gestion
    p: Nous coordonnons les professionnels et les différentes phases du projet pour que le processus soit plus simple, plus ordonné et plus cohérent.
    url: /fr/blog/cout-annuel-entretien-maison-costa-brava/
    img: /assets/img/home/paso-04.jpg
  svc_alt: Maison en pierre parmi les oliviers avec vue sur la mer
  svc_cta: Parlez-nous de votre projet
  proc_eyebrow: Notre méthode
  proc_h2: Un processus clair.
  proc_h2_em: Des décisions en confiance.
  proc_intro: Chaque recherche est différente. Notre méthode vous aide à avancer pas à pas, avec une vision d'ensemble et un accompagnement professionnel tout au long du parcours.
  steps:
  - t: Nous vous écoutons
    p: 'Nous commençons par apprendre à vous connaître : ce que vous cherchez, comment vous souhaitez vivre et ce qui compte pour vous.'
  - t: Nous fixons le cap
    p: Nous traduisons vos priorités en critères clairs pour orienter la recherche et évaluer les options avec justesse.
  - t: Nous analysons et décidons
    p: Nous étudions chaque opportunité sous un angle architectural et immobilier pour que vous puissiez décider en connaissance de cause.
  - t: Nous vous accompagnons jusqu'à l'étape suivante
    p: Nous coordonnons les professionnels nécessaires et vous aidons à avancer vers l'achat, la rénovation ou la mise en état des lieux.
  proc_cta: Commençons par une conversation
  mag_eyebrow: Journal
  mag_h2: Idées, lieux et regards sur la Méditerranée.
  mag_intro: Une sélection d'histoires pour découvrir l'architecture locale, les matériaux, les intérieurs et les façons de vivre qui rendent cette côte unique. De l'inspiration et des connaissances pour regarder chaque espace d'un autre œil.
