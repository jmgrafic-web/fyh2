  contact_text: Cuéntanos qué estás buscando o qué proyecto tienes en mente. Escucharemos tus ideas y te orientaremos sobre cómo podemos ayudarte.
  contact_error: No hemos podido enviar el mensaje. Inténtalo de nuevo o escríbenos a hello@findyourhaven.com.
  contact_subject: Nueva consulta desde la web (ES)
  lang_code: ES
