  contact_alt: Casa de piedra con buganvilla frente al mar
  partners_eyebrow: Partners
  partners_h2: ¿Eres profesional en la costa?
  partners_h2_em: Colaboremos.
  partners_text: Trabajamos con una red seleccionada de agencias inmobiliarias, constructoras, arquitectos, abogados, interioristas y empresas de gestión y mantenimiento. Te presentamos clientes internacionales con un encargo claro y un presupuesto validado, y nos ocupamos de la comunicación con ellos.
  partners_points:
