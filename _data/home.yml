# Textos de la portada (4 idiomas). Plantilla: _includes/home.html
es:
  title: Find Your Haven — Tu partner inmobiliario en la Costa Catalana
  description: 'Arquitectos y profesionales inmobiliarios que te acompañan a encontrar y transformar tu vivienda en la Costa Catalana: Costa Brava, Maresme y Costa Daurada.'
  hero_alt: Terraza de piedra con piscina frente al mar Mediterráneo
  hero_title:
  - Encuentra tu
  - refugio mediterráneo.
  hero_sub:
  - Arraigados en la arquitectura.
  - Centrados en ti.
  hero_text: Te acompañamos en cada paso para encontrar y transformar un lugar que sientas como propio.
  hero_cta: Cuéntanos qué estás buscando
  hero_cta_short: Hablemos
  hero_cta2: Descubre cómo trabajamos
  points:
  - Un solo interlocutor
  - Sin coste para ti
  - Profesionales de confianza
  a_about: quienes-somos
  a_services: servicios
  a_process: proceso
  a_contact: contacto
  a_partners: partners
  a_journal: revista-home
  model_eyebrow: Nuestro modelo
  model_h2: Como arquitectos, te acompañamos.
  model_h2_em: Siempre de tu lado.
  model_p1: Comprar una vivienda en el Mediterráneo es mucho más que encontrar una casa bonita. Es elegir un lugar, entender su potencial y tomar decisiones con confianza. Por eso reunimos conocimiento arquitectónico, experiencia inmobiliaria y una red de colaboradores seleccionados para acompañarte desde la primera idea hasta el último detalle.
  model_p2: <strong>Nuestro servicio de acompañamiento no tiene coste para ti.</strong> Trabajamos con partners seleccionados para ayudarte a avanzar con criterio, transparencia y tranquilidad.
  model_alt: Salón de una casa mediterránea abierto al mar
  model_flow_label: Tú, Find Your Haven y nuestros partners
  flow:
  - t: Tú
    p: Entendemos tus necesidades, tus prioridades y la forma en la que quieres vivir.
  - t: Find Your Haven
    p: Te orientamos y coordinamos el proceso con una mirada arquitectónica e inmobiliaria.
  - t: Nuestros partners
    p: Colaboramos con profesionales seleccionados cuando cada proyecto lo necesita.
  model_cta: Hablemos de lo que tienes en mente
  svc_eyebrow: Nuestros servicios
  svc_h2: De la primera búsqueda a las llaves.
  svc_h2_em: Seis servicios. Un solo interlocutor.
  svc_intro: Te ayudamos a tomar decisiones informadas en cada etapa, combinando visión arquitectónica, conocimiento del mercado y acompañamiento personal.
  services:
  - t: Búsqueda e informe preliminar
    p: Analizamos tus necesidades y prioridades para definir un punto de partida claro, y buscamos opciones alineadas con tu estilo de vida y tus objetivos, mirando más allá de las fotografías.
    url: /es/blog/comprar-vivienda-costa-brava-extranjero/
    img: /assets/img/hero/hero-terraza-tablet.jpg
  - t: Due diligence técnica
    p: Revisamos los aspectos técnicos relevantes de la vivienda para ayudarte a comprender su estado, sus posibilidades y los puntos que conviene estudiar antes de decidir.
    url: /es/blog/due-diligence-tecnica-inmobiliaria/
    img: /assets/img/home/servicios.jpg
  - t: Representación
    p: Defendemos tus intereses durante el proceso, facilitamos la comunicación entre las partes y te ayudamos a avanzar con mayor claridad.
    url: /es/blog/errores-legales-comprar-sin-abogado/
    img: /assets/img/home/contacto.jpg
  - t: Arquitectura, reforma y obra
    p: Valoramos el potencial de cada espacio y te acompañamos en la definición de mejoras, reformas y soluciones adaptadas a tus necesidades.
    url: /es/blog/cuanto-cuesta-reformar-casa-costa-catalana/
    img: /assets/img/home/paso-02.jpg
  - t: Interiorismo
    p: Damos forma a interiores funcionales y serenos, con materiales naturales, proporciones cuidadas y una estética conectada con el Mediterráneo.
    url: '#contacto'
    img: /assets/img/home/paso-03.jpg
  - t: Gestión
    p: Coordinamos los profesionales y las distintas fases del proyecto para que el proceso sea más sencillo, ordenado y coherente.
    url: /es/blog/cuanto-cuesta-mantener-casa-costa-brava-al-ano/
    img: /assets/img/home/paso-04.jpg
  svc_alt: Casa de piedra entre olivos con vistas al mar
  svc_cta: Cuéntanos tu proyecto
  proc_eyebrow: Cómo trabajamos
  proc_h2: Un proceso claro.
  proc_h2_em: Decisiones con confianza.
  proc_intro: Cada búsqueda es diferente. Nuestro método te ayuda a avanzar paso a paso, con una visión global y acompañamiento profesional durante todo el recorrido.
  steps:
  - t: Te escuchamos
    p: 'Empezamos por conocerte: qué buscas, cómo quieres vivir y qué es importante para ti.'
  - t: Definimos el rumbo
    p: Convertimos tus prioridades en criterios claros para orientar la búsqueda y valorar las opciones con sentido.
  - t: Analizamos y decidimos
    p: Estudiamos cada oportunidad desde una perspectiva arquitectónica e inmobiliaria para que puedas decidir con más información.
  - t: Te acompañamos hasta el siguiente paso
    p: Coordinamos a los profesionales necesarios y te ayudamos a avanzar hacia la compra, la reforma o la puesta a punto del espacio.
  proc_cta: Empecemos por una conversación
  mag_eyebrow: Revista
  mag_h2: Ideas, lugares y miradas sobre el Mediterráneo.
  mag_intro: Una selección de historias para descubrir la arquitectura local, los materiales, los interiores y las formas de vivir que hacen especial a esta costa. Inspiración y conocimiento para mirar cada espacio con otros ojos.
  mag_all: Todos
  mag_read: Leer artículo
  mag_btn: Explora la revista
  guide_eyebrow: Guía gratuita
  guide_title: Comprar en la Costa Brava · Edición 2026
  guide_text: Déjanos tu email y te la enviamos. De vez en cuando, también alguna novedad de la costa.
  guide_next: /es/gracias-guia/
  guide_subject: Nueva suscripción — Guía Costa Brava 2026
  guide_placeholder: Tu email
  guide_btn: Recibir la guía
  guide_note: Al suscribirte aceptas nuestra
  guide_note_link: política de privacidad
  form_action: https://formspree.io/f/TU_ID_FORMSPREE
