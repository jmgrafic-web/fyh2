fr:
  title: Find Your Haven — Votre Property Partner sur la Côte Catalane
  description: 'Des architectes et professionnels de l''immobilier qui vous aident à trouver et transformer votre maison sur la côte catalane : Costa Brava, Maresme et Costa Daurada.'
  hero_alt: Terrasse en pierre avec piscine face à la Méditerranée
  hero_title:
  - Trouvez votre
  - refuge méditerranéen.
  hero_sub:
  - Enracinés dans l'architecture.
  - Centrés sur vous.
  hero_text: Nous vous accompagnons à chaque étape pour trouver et transformer un lieu que vous sentirez vraiment vôtre.
  hero_cta: Dites-nous ce que vous cherchez
  hero_cta_short: Parlons-en
  hero_cta2: Découvrez notre méthode
