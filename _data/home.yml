  a_about: over-ons
  a_services: diensten
  a_process: proces
  a_contact: contact
  a_partners: partners
  a_journal: journal-home
  model_eyebrow: Ons model
  model_h2: Als architecten staan we naast je.
  model_h2_em: Altijd aan jouw kant.
  model_p1: Een woning kopen aan de Middellandse Zee is veel meer dan een mooi huis vinden. Het is een plek kiezen, het potentieel ervan begrijpen en met vertrouwen beslissingen nemen. Daarom brengen we architectonische kennis, vastgoedervaring en een netwerk van geselecteerde partners samen om je te begeleiden van het eerste idee tot het laatste detail.
  model_p2: <strong>Onze begeleiding kost jou niets.</strong> We werken met geselecteerde partners om je te helpen vooruit te gaan met inzicht, transparantie en gemoedsrust.
  model_alt: Woonkamer van een mediterraan huis met zicht op zee
  model_flow_label: Jij, Find Your Haven en onze partners
  flow:
  - t: Jij
    p: We begrijpen je behoeften, je prioriteiten en de manier waarop je wilt leven.
  - t: Find Your Haven
    p: We geven je richting en coördineren het proces met een architectonische én vastgoedblik.
  - t: Onze partners
    p: We werken samen met geselecteerde professionals wanneer een project daarom vraagt.
  model_cta: Laten we praten over wat je voor ogen hebt
  svc_eyebrow: Onze diensten
  svc_h2: Van de eerste zoektocht tot de sleutels.
  svc_h2_em: Zes diensten. Eén aanspreekpunt.
  svc_intro: We helpen je in elke fase weloverwogen beslissingen te nemen, met een architectonische visie, marktkennis en persoonlijke begeleiding.
  services:
  - t: Zoektocht & voorlopig rapport
    p: We analyseren je behoeften en prioriteiten om een helder vertrekpunt te bepalen en zoeken opties die passen bij je levensstijl en je doelen, verder kijkend dan de foto’s.
    url: /nl/blog/huis-kopen-costa-brava-buitenlander-gids/
    img: /assets/img/hero/hero-terraza-tablet.jpg
  - t: Technische due diligence
    p: We controleren de relevante technische aspecten van de woning, zodat je de staat, de mogelijkheden en de aandachtspunten begrijpt voordat je beslist.
    url: /nl/blog/technische-due-diligence-vastgoed-uitgelegd/
    img: /assets/img/home/servicios.jpg
  - t: Vertegenwoordiging
    p: We behartigen je belangen tijdens het hele proces, vergemakkelijken de communicatie tussen de partijen en helpen je met meer duidelijkheid vooruit.
    url: /nl/blog/juridische-fouten-kopen-zonder-advocaat/
    img: /assets/img/home/contacto.jpg
  - t: Architectuur, renovatie & bouw
    p: We beoordelen het potentieel van elke ruimte en begeleiden je bij het bepalen van verbeteringen, renovaties en oplossingen op maat.
    url: /nl/blog/renovatiekosten-catalaanse-kust-gids/
    img: /assets/img/home/paso-02.jpg
  - t: Interieurontwerp
    p: We geven vorm aan functionele, serene interieurs met natuurlijke materialen, zorgvuldige verhoudingen en een esthetiek verbonden met de Middellandse Zee.
    url: '#contact'
    img: /assets/img/home/paso-03.jpg
  - t: Beheer
    p: We coördineren de professionals en de verschillende fasen van het project, zodat het proces eenvoudiger, overzichtelijker en samenhangender verloopt.
    url: /nl/blog/kosten-onderhoud-tweede-woning-costa-brava-per-jaar/
    img: /assets/img/home/paso-04.jpg
  svc_alt: Stenen huis tussen olijfbomen met uitzicht op zee
  svc_cta: Vertel ons over je project
  proc_eyebrow: Hoe wij werken
  proc_h2: Een helder proces.
  proc_h2_em: Beslissingen met vertrouwen.
  proc_intro: Elke zoektocht is anders. Onze methode helpt je stap voor stap vooruit, met een totaalbeeld en professionele begeleiding gedurende het hele traject.
  steps:
  - t: We luisteren
    p: 'We beginnen met je te leren kennen: wat je zoekt, hoe je wilt leven en wat voor jou belangrijk is.'
  - t: We bepalen de koers
    p: We vertalen je prioriteiten naar heldere criteria om de zoektocht te sturen en de opties zinvol te beoordelen.
  - t: We analyseren en beslissen
    p: We bestuderen elke kans vanuit een architectonisch en vastgoedperspectief, zodat je met meer informatie kunt beslissen.
  - t: We begeleiden je naar de volgende stap
    p: We coördineren de nodige professionals en helpen je op weg naar de aankoop, de renovatie of het klaarmaken van de ruimte.
  proc_cta: Laten we beginnen met een gesprek
  mag_eyebrow: Journal
  mag_h2: Ideeën, plekken en blikken op de Middellandse Zee.
  mag_intro: Een selectie verhalen om de lokale architectuur, materialen, interieurs en manieren van leven te ontdekken die deze kust bijzonder maken. Inspiratie en kennis om elke ruimte met andere ogen te bekijken.
