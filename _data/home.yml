  model_eyebrow: Our model
  model_h2: As architects, we walk alongside you.
  model_h2_em: Always on your side.
  model_p1: Buying a home on the Mediterranean is about much more than finding a beautiful house. It means choosing a place, understanding its potential and making decisions with confidence. That is why we bring together architectural knowledge, property experience and a network of selected partners to guide you from the very first idea to the final detail.
  model_p2: <strong>Our advisory service comes at no cost to you.</strong> We work with selected partners to help you move forward with sound judgement, transparency and peace of mind.
  model_alt: Living room of a Mediterranean home opening onto the sea
  model_flow_label: You, Find Your Haven and our partners
  flow:
  - t: You
    p: We understand your needs, your priorities and the way you want to live.
  - t: Find Your Haven
    p: We guide you and coordinate the process with both an architectural and a property perspective.
  - t: Our partners
    p: We work with selected professionals whenever a project calls for it.
  model_cta: Let's talk about what you have in mind
  svc_eyebrow: Our services
  svc_h2: From the first search to the keys.
  svc_h2_em: Six services. One point of contact.
  svc_intro: We help you make informed decisions at every stage, combining architectural vision, market knowledge and personal guidance.
  services:
  - t: Search & preliminary report
    p: We analyse your needs and priorities to set a clear starting point, then look for options aligned with your lifestyle and your goals, looking beyond the photographs.
    url: /en/blog/buying-property-costa-brava-foreigner-guide/
    img: /assets/img/hero/hero-terraza-tablet.jpg
  - t: Technical due diligence
    p: We review the relevant technical aspects of the property so you understand its condition, its possibilities and the points worth studying before you decide.
    url: /en/blog/technical-due-diligence-property-explained/
    img: /assets/img/home/servicios.jpg
  - t: Representation
    p: We defend your interests throughout the process, ease communication between the parties and help you move forward with greater clarity.
    url: /en/blog/legal-mistakes-buying-without-lawyer/
    img: /assets/img/home/contacto.jpg
  - t: Architecture, renovation & construction
    p: We assess the potential of every space and guide you in defining improvements, renovations and solutions tailored to your needs.
    url: /en/blog/renovation-cost-catalan-coast-guide/
    img: /assets/img/home/paso-02.jpg
  - t: Interior design
    p: We shape functional, serene interiors with natural materials, careful proportions and an aesthetic connected to the Mediterranean.
    url: '#contact'
    img: /assets/img/home/paso-03.jpg
  - t: Management
    p: We coordinate the professionals and the different stages of the project so the process is simpler, more orderly and coherent.
    url: /en/blog/running-costs-holiday-home-costa-brava/
    img: /assets/img/home/paso-04.jpg
  svc_alt: Stone house among olive trees overlooking the sea
  svc_cta: Tell us about your project
  proc_eyebrow: How we work
  proc_h2: A clear process.
  proc_h2_em: Decisions made with confidence.
  proc_intro: Every search is different. Our method helps you move forward step by step, with an overall view and professional support all the way.
  steps:
  - t: We listen
    p: 'We start by getting to know you: what you are looking for, how you want to live and what matters to you.'
  - t: We set the course
    p: We turn your priorities into clear criteria to steer the search and weigh up the options meaningfully.
  - t: We analyse and decide
    p: We study every opportunity from an architectural and property perspective so you can decide with better information.
  - t: We take you to the next step
    p: We coordinate the professionals you need and help you move towards the purchase, the renovation or getting the space ready.
  proc_cta: Let's start with a conversation
  mag_eyebrow: Journal
  mag_h2: Ideas, places and perspectives on the Mediterranean.
  mag_intro: A selection of stories to discover the local architecture, materials, interiors and ways of living that make this coast special. Inspiration and knowledge to see every space with fresh eyes.
